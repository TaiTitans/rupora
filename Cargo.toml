[package]
name = "rupora"
version = "0.1.0"
edition = "2021"
description = "A Typora-style WYSIWYG Markdown editor written in Rust"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "links", "persistence", "wayland", "x11"] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["file", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2
